name: Build book
run-name: "Build book ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        continue-on-error: true
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: false
      # We manage the Lake cache ourselves rather than using
      # lean-action's built-in caching because lean-action saves the
      # cache before we generate the site. As a result, Verso and its
      # HTML artifacts would never be cached.
      - name: Restore Lake cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Remove corrupt cached packages
        run: |
          if [ -d .lake/packages ]; then
            find .lake/packages -mindepth 1 -maxdepth 1 -type d | while read -r package; do
              if ! git -C "$package" rev-parse HEAD >/dev/null 2>&1; then
                echo "Removing corrupt cached package: $package"
                rm -rf "$package"
              fi
            done
          fi
      - name: Build project
        run: lake build
      - name: Build doc-gen
        run: lake -R -Kenv=dev build Analysis:docs
      - name: Build book
        id: build-site
        run: |
          SITE_PATH="$(lake query :literateHtml)"
          echo "Generated site at: $SITE_PATH"
          echo "path=$SITE_PATH" >> "$GITHUB_OUTPUT"
          mkdir -p _site
          cp -r "$SITE_PATH/." _site
      - name: Copy docs to site
        run: cp -r .lake/build/doc _site/docs
      - name: Remove unnecessary Lake files from docs
        run: |
          find _site/docs -name "*.trace" -delete
          find _site/docs -name "*.hash" -delete
      - name: Save Lake cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Upload website
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    continue-on-error: true   # racecar: scan job other jobs need
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
